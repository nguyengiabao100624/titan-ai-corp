name: CI Quality, Security & Sub-50ms Latency Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-46-brains-and-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit 46 Six-Layer Genius Brains
        run: python scripts/titan_cli.py audit

      - name: Run Full Unit, Concurrency, Cloud Sync, API & Latency Stress Suite
        run: python -m unittest discover -s tests -v
