name: Deploy Titan Command Center 24-7 (GitHub Pages CDN)

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/web_ui/**"
      - "corporate_hq/cloud_state/snapshot.json"
      - "corporate_hq/cloud_state/online_endpoint.json"
      - "corporate_hq/projects/**"
      - ".github/workflows/deploy_command_center.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-command-center"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Titan AI Corp Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hydrate & Ensure Complete Cloud Snapshot Exists
        run: |
          python scripts/titan_cli.py hydrate-snapshot
          python scripts/titan_cli.py sync-snapshot

      - name: Assemble Zero-Sleep Static PWA Bundle
        run: |
          mkdir -p _site/cloud_state _site/projects
          cp -r scripts/web_ui/* _site/
          cp corporate_hq/cloud_state/snapshot.json _site/cloud_state/snapshot.json
          if [ -f corporate_hq/cloud_state/online_endpoint.json ]; then cp corporate_hq/cloud_state/online_endpoint.json _site/cloud_state/online_endpoint.json; fi
          if [ -d corporate_hq/projects ]; then cp -r corporate_hq/projects/* _site/projects/ 2>/dev/null || true; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages Global CDN
        id: deployment
        uses: actions/deploy-pages@v4
